[package]
name = "onair-settings"
version = "0.4.0"
edition = "2021"
rust-version = "1.92"
description = "Slint settings window for the OnAir overlay"
license = "MIT"

[[bin]]
name = "onair-settings"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18.1"

[dependencies]
onair-config = { path = "../onair-config" }
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
