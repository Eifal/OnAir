[package]
name = "onair"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "OnAir: Voicemeeter mic overlay"
license = "MIT"

[[bin]]
name = "onair"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
onair-config = { path = "crates/onair-config" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = ["crates/onair-config", "crates/onair-settings"]
resolver = "2"
